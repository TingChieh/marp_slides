<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TingChieh 的幻灯片与演示目录，收录课堂分享、主题报告和一些想法。">
  <meta name="theme-color" content="#12392a">
  <title>Slides · aisaka.cc</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2312392a'/><rect x='7' y='8' width='18' height='13' rx='1' fill='none' stroke='%23f2c230' stroke-width='2'/><path d='M16 22v4m-4 0h8' stroke='%23f2c230' stroke-width='2'/></svg>">
  <link rel="preload" href="fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap;
      src: url("fonts/barlow-condensed-600.woff2") format("woff2"); }
    :root { --green: #12392a; --paper: #e4eadf; --moss: #a3b6a8; --yellow: #f2c230;
      --line: #436151; --sign: "Barlow Condensed", "Arial Narrow", sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--green); color: var(--paper);
      font: 16px/1.7 -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 6px; }
    .page { width: min(1100px, calc(100% - 80px)); min-height: 100svh; margin: auto;
      display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding: 35px 0; border-bottom: 1px solid var(--line); }
    .brand { font: 600 24px/1 var(--sign); letter-spacing: .08em; text-decoration: none; }
    .brand span { color: var(--yellow); }
    .home { color: var(--moss); font-size: 13px; text-decoration: none; }
    .home:hover, footer a:hover { color: var(--yellow); }
    main { flex: 1; padding: clamp(48px, 8vw, 100px) 0 80px; }
    .eyebrow { margin: 0 0 20px; color: var(--yellow); font: 600 15px/1 var(--sign); letter-spacing: .18em; }
    h1 { margin: 0; font-size: clamp(36px, 5.2vw, 62px); font-weight: 600; line-height: 1.25;
      letter-spacing: -.035em; }
    .intro { margin: 22px 0 58px; color: var(--moss); font-size: 16px; }
    .section-heading { display: flex; justify-content: space-between; align-items: center;
      gap: 20px; padding-bottom: 15px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .08em; }
    .count { color: var(--moss); font: 600 16px/1 var(--sign); letter-spacing: .08em; }
    .collection { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px;
      list-style: none; margin: 0; padding: 0; }
    .deck { display: block; height: 100%; text-decoration: none; border-radius: 3px; }
    .cover { position: relative; aspect-ratio: 16 / 9; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; overflow: hidden;
      padding: 25px; text-align: center; border: 1px solid #bad1bb; border-radius: 3px;
      background: linear-gradient(120deg, #e8f5e9, #fff); color: #2e7d32;
      transition: transform .2s ease, box-shadow .2s ease; }
    .cover-icon { font-size: 35px; line-height: 1; }
    .cover-title { font-size: clamp(26px, 3vw, 36px); font-weight: 700; line-height: 1.2; }
    .cover-subtitle { color: #315e36; font-size: 14px; line-height: 1.5; }
    .cover-number { position: absolute; left: 18px; top: 15px; color: #608366;
      font: 600 13px/1 var(--sign); letter-spacing: .12em; }
    .meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 22px;
      color: var(--moss); font-size: 12px; letter-spacing: .04em; }
    .pages { font: 600 15px/1.7 var(--sign); letter-spacing: .08em; }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-top: 10px; }
    h3 { margin: 0; font-size: 24px; font-weight: 500; line-height: 1.4; }
    .open { flex-shrink: 0; color: var(--yellow); font-size: 13px; }
    .description { margin: 12px 0 0; color: var(--moss); font-size: 14px; line-height: 1.9; }
    .deck:hover .cover, .deck:focus-visible .cover { transform: translateY(-4px); box-shadow: 0 12px 28px #071b1933; }
    .deck:hover h3, .deck:focus-visible h3 { color: var(--yellow); }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding: 24px 0 28px; border-top: 1px solid var(--line); color: var(--moss); font-size: 12px; }
    footer a { display: inline-flex; align-items: center; gap: 8px; padding: 8px 0; text-decoration: none; }
    footer svg { width: 18px; height: 18px; fill: currentColor; }
    @media (max-width: 680px) {
      .page { width: calc(100% - 40px); }
      header { padding: 25px 0; }
      .brand { font-size: 22px; }
      main { padding: 48px 0 60px; }
      .intro { margin-bottom: 42px; font-size: 14px; }
      .collection { grid-template-columns: 1fr; gap: 40px; }
      .cover-title { font-size: clamp(26px, 7vw, 36px); }
      .cover-subtitle { font-size: 12px; }
      h3 { font-size: 22px; }
      footer { gap: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .cover { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="./" aria-label="Slides 目录首页">AISAKA<span> / </span>SLIDES</a>
      <a class="home" href="https://aisaka.cc/">返回主页 <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <p class="eyebrow">NOTES IN SLIDES</p>
      <h1>幻灯片与演示</h1>
      <p class="intro">课堂分享、主题报告和一些想法，整理在这里。</p>
      <section aria-labelledby="collection-title">
        <div class="section-heading">
          <h2 id="collection-title">全部演示</h2>
          <span class="count">01 / SLIDE DECK</span>
        </div>
        <ul class="collection">
          <li>
            <a class="deck" href="amazon.html" aria-labelledby="amazon-title" aria-describedby="amazon-description">
              <div class="cover" aria-hidden="true">
                <span class="cover-number">01 / AMAZON RAINFOREST</span>
                <span class="cover-icon">🌳</span>
                <span class="cover-title">消失的绿色</span>
                <span class="cover-subtitle">——巴西亚马逊雨林的呼救</span>
              </div>
              <div class="meta"><span>环境与生态</span><span class="pages">37 PAGES</span></div>
              <div class="title-row"><h3 id="amazon-title">消失的绿色</h3><span class="open">打开演示 <span aria-hidden="true">↗</span></span></div>
              <p class="description" id="amazon-description">从亚马逊雨林的消失，到背后的原因、生态影响，以及我们可以采取的行动。</p>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer>
      <span>TingChieh · 幻灯片收藏</span>

    </footer>
  </div>
</body>
</html>
